# Xcode project for the menu bar app and its virtual microphone driver.
# Generate with `make app` (needs XcodeGen); the .xcodeproj is not committed.
name: NoiseReduction
options:
  bundleIdPrefix: cool.jacoblin
  deploymentTarget:
    macOS: "14.0"
packages:
  EfficientNoiseReduction:
    path: ..
settings:
  base:
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: 1
    DEVELOPMENT_TEAM: 5H75SGA7KP
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    SIGN_IDENTITY: Developer ID Application
    CODE_SIGN_IDENTITY: $(SIGN_IDENTITY)
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
    OTHER_CODE_SIGN_FLAGS: --timestamp
    ARCHS: arm64
targets:
  NoiseReductionDriver:
    type: bundle
    platform: macOS
    sources:
      - path: ../Driver
        excludes: [Info.plist]
    settings:
      base:
        PRODUCT_NAME: EfficientNoiseReduction
        PRODUCT_BUNDLE_IDENTIFIER: cool.jacoblin.EfficientNoiseReduction.Driver
        WRAPPER_EXTENSION: driver
        INFOPLIST_FILE: ../Driver/Info.plist
        OTHER_LDFLAGS: -framework CoreAudio -framework CoreFoundation
        SKIP_INSTALL: YES
  NoiseReduction:
    type: application
    platform: macOS
    sources:
      - path: NoiseReduction
        excludes: [Info.plist, NoiseReduction.entitlements]
    dependencies:
      - package: EfficientNoiseReduction
        product: EfficientNoiseReduction
      - target: NoiseReductionDriver
        embed: true
        copy:
          destination: resources
    settings:
      base:
        PRODUCT_NAME: Noise Reduction
        PRODUCT_BUNDLE_IDENTIFIER: cool.jacoblin.EfficientNoiseReduction
        INFOPLIST_FILE: NoiseReduction/Info.plist
        CODE_SIGN_ENTITLEMENTS: NoiseReduction/NoiseReduction.entitlements
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: NO

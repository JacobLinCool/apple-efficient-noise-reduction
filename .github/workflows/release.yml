# Builds, signs and notarizes the Noise Reduction app and attaches it to a GitHub release.
# Runs on version tags (e.g. 0.2.0), or by hand for an existing tag.
name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release
        required: true

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-26
    environment: release
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen

      - name: Import Developer ID identity
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          printf '%s' "$CERTIFICATE" | base64 -D > "$RUNNER_TEMP/application.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/application.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/application.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security default-keychain -d user -s "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Build, sign and notarize
        env:
          NOTARY_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          KEY="$RUNNER_TEMP/AuthKey_$NOTARY_KEY_ID.p8"
          printf '%s' "$NOTARY_KEY" | base64 -D > "$KEY"
          chmod 600 "$KEY"
          make dist VERSION="$TAG" BUILD="${{ github.run_number }}" \
            NOTARY_AUTH="--key $KEY --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID"
          mv .build/NoiseReduction.zip "$RUNNER_TEMP/NoiseReduction-$TAG.zip"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes
          gh release upload "$TAG" "$RUNNER_TEMP/NoiseReduction-$TAG.zip" --clobber

      - name: Clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8
